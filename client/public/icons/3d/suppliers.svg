<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <filter id="supp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
    <filter id="truck-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>

    <!-- Warehouse Gradients -->
    <linearGradient id="wh-roof" x1="12" y1="26" x2="64" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="wh-wall-left" x1="12" y1="44" x2="42" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="wh-wall-right" x1="42" y1="44" x2="68" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="wh-door" x1="22" y1="56" x2="34" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Truck Gradients -->
    <linearGradient id="truck-body" x1="40" y1="48" x2="84" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="truck-cab" x1="68" y1="56" x2="88" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="truck-wheel" x1="44" y1="72" x2="56" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="48" cy="86" rx="38" ry="6" fill="#0F172A" opacity="0.18"/>

  <!-- Warehouse Building Background -->
  <g filter="url(#supp-shadow)">
    <!-- Roof Triangular/Gabled 3D -->
    <path d="M12 40 L38 24 L64 40 L38 52 Z" fill="url(#wh-roof)"/>
    <path d="M12 40 L38 52 V76 L12 64 Z" fill="url(#wh-wall-left)"/>
    <path d="M38 52 L64 40 V64 L38 76 Z" fill="url(#wh-wall-right)"/>

    <!-- Loading bay shutter door -->
    <path d="M22 56 L34 50 V68 L22 74 Z" fill="url(#wh-door)"/>
    <line x1="22" y1="60" x2="34" y2="54" stroke="#475569" stroke-width="1"/>
    <line x1="22" y1="64" x2="34" y2="58" stroke="#475569" stroke-width="1"/>
    <line x1="22" y1="68" x2="34" y2="62" stroke="#475569" stroke-width="1"/>

    <!-- Roof specular ridge -->
    <path d="M38 24 L64 40" stroke="#C7D2FE" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- 3D Delivery Cargo Truck Foreground -->
  <g filter="url(#truck-glow)">
    <!-- Cargo Box / Container -->
    <rect x="38" y="48" width="28" height="24" rx="4" fill="url(#truck-body)"/>
    <!-- Container Grooves -->
    <line x1="45" y1="52" x2="45" y2="68" stroke="#0369A1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="52" y1="52" x2="52" y2="68" stroke="#0369A1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="59" y1="52" x2="59" y2="68" stroke="#0369A1" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Truck Cab -->
    <path d="M66 56 H77 C80 56 83 58 84 62 L87 69 C88 71 88 72 88 74 V76 H66 Z" fill="url(#truck-cab)"/>
    <!-- Cab Window -->
    <path d="M69 59 H76 L81 66 H69 Z" fill="#E0F2FE" opacity="0.9"/>
    <!-- Headlight -->
    <circle cx="86" cy="73" r="2" fill="#FEF08A"/>

    <!-- Wheels (3D Tires with Hubs) -->
    <!-- Rear Wheel 1 -->
    <circle cx="46" cy="76" r="6" fill="url(#truck-wheel)"/>
    <circle cx="46" cy="76" r="2.5" fill="#E2E8F0"/>
    <!-- Rear Wheel 2 -->
    <circle cx="58" cy="76" r="6" fill="url(#truck-wheel)"/>
    <circle cx="58" cy="76" r="2.5" fill="#E2E8F0"/>
    <!-- Front Wheel -->
    <circle cx="78" cy="76" r="6" fill="url(#truck-wheel)"/>
    <circle cx="78" cy="76" r="2.5" fill="#E2E8F0"/>
  </g>
</svg>
