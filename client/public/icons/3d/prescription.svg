<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <filter id="rx-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
    <filter id="pen-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>

    <!-- Clipboard Board Gradient -->
    <linearGradient id="rx-board" x1="16" y1="14" x2="76" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Clip Gradient -->
    <linearGradient id="rx-clip" x1="36" y1="8" x2="56" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Pen Gradients -->
    <linearGradient id="rx-pen-body" x1="68" y1="44" x2="88" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="46" cy="88" rx="34" ry="5.5" fill="#0F172A" opacity="0.18"/>

  <!-- Clipboard -->
  <g filter="url(#rx-shadow)">
    <!-- Base Board -->
    <rect x="18" y="16" width="56" height="70" rx="10" fill="url(#rx-board)"/>

    <!-- Paper Sheet -->
    <rect x="23" y="22" width="46" height="58" rx="6" fill="#FFFFFF"/>

    <!-- Rx Symbol -->
    <text x="32" y="38" font-family="'Times New Roman', serif" font-weight="bold" font-style="italic" font-size="16" fill="#0284C7">℞</text>

    <!-- Medical Green Cross Badge -->
    <circle cx="58" cy="33" r="7" fill="#DCFCE7"/>
    <path d="M57 29 H59 V32 H62 V34 H59 V37 H57 V34 H54 V32 H57 Z" fill="#16A34A"/>

    <!-- Prescription Lines -->
    <rect x="30" y="44" width="32" height="3" rx="1.5" fill="#E2E8F0"/>
    <rect x="30" y="51" width="30" height="3" rx="1.5" fill="#E2E8F0"/>
    <rect x="30" y="58" width="24" height="3" rx="1.5" fill="#E2E8F0"/>
    <rect x="30" y="65" width="28" height="3" rx="1.5" fill="#E2E8F0"/>

    <!-- Top Metallic Clip -->
    <rect x="34" y="10" width="24" height="12" rx="4" fill="url(#rx-clip)"/>
    <rect x="40" y="7" width="12" height="5" rx="2.5" fill="#64748B"/>
    <circle cx="46" cy="16" r="2.5" fill="#475569"/>
  </g>

  <!-- 3D Medical Pen resting on the right -->
  <g filter="url(#pen-glow)" transform="rotate(-24 74 62)">
    <!-- Pen Body -->
    <rect x="70" y="32" width="8" height="42" rx="4" fill="url(#rx-pen-body)"/>
    <!-- Pen Grip Lines -->
    <line x1="70" y1="62" x2="78" y2="62" stroke="#065F46" stroke-width="1.2"/>
    <line x1="70" y1="65" x2="78" y2="65" stroke="#065F46" stroke-width="1.2"/>
    <!-- Pen Cone Tip -->
    <path d="M70 74 L74 84 L78 74 Z" fill="#E2E8F0"/>
    <path d="M73 81.5 L74 84 L75 81.5 Z" fill="#1E293B"/>
    <!-- Top Cap Button -->
    <path d="M71 32 C71 30 73 29 74 29 C75 29 77 30 77 32 Z" fill="#E2E8F0"/>
    <!-- Pen Clip -->
    <rect x="70" y="35" width="2" height="16" rx="1" fill="#CBD5E1"/>
  </g>
</svg>
