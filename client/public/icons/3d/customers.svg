<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <filter id="char-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#1E1B4B" flood-opacity="0.25"/>
    </filter>
    <filter id="star-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#CA8A04" flood-opacity="0.5"/>
    </filter>

    <!-- Head & Skin Gradients -->
    <radialGradient id="skin-face" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="60%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </radialGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hair-clay" x1="28" y1="12" x2="68" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Suit / Torso Gradient -->
    <linearGradient id="suit-body" x1="24" y1="52" x2="72" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Star Gradients -->
    <linearGradient id="star-gold" x1="60" y1="52" x2="84" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <g filter="url(#char-shadow)">
    <!-- Shoulders / Torso -->
    <path d="M22 84 C22 66 32 58 48 58 C64 58 74 66 74 84 Z" fill="url(#suit-body)" stroke="#3730A3" stroke-width="1.5"/>
    <!-- Collar Shirt -->
    <path d="M42 58 L48 68 L54 58 Z" fill="#FFFFFF"/>
    <path d="M47 68 L49 68 L48.5 78 Z" fill="#EF4444"/>

    <!-- Neck -->
    <rect x="43" y="48" width="10" height="12" rx="4" fill="#FDBA74"/>

    <!-- Head / Face -->
    <circle cx="48" cy="36" r="16" fill="url(#skin-face)"/>

    <!-- Hair -->
    <path d="M32 34 C32 20 40 14 52 14 C62 14 65 20 65 30 C60 28 54 26 46 28 C38 30 35 34 32 34 Z" fill="url(#hair-clay)"/>

    <!-- Friendly Eyes -->
    <circle cx="43" cy="36" r="2" fill="#1E293B"/>
    <circle cx="53" cy="36" r="2" fill="#1E293B"/>
    <circle cx="42.5" cy="35.5" r="0.6" fill="#FFFFFF"/>
    <circle cx="52.5" cy="35.5" r="0.6" fill="#FFFFFF"/>

    <!-- Smile -->
    <path d="M44 42 Q48 46 52 42" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Cheeks Blush -->
    <circle cx="39" cy="40" r="2.5" fill="#F87171" opacity="0.4"/>
    <circle cx="57" cy="40" r="2.5" fill="#F87171" opacity="0.4"/>

    <!-- Floating 3D VIP Gold Star Badge -->
    <g filter="url(#star-glow)">
      <circle cx="70" cy="62" r="15" fill="url(#star-gold)" stroke="#CA8A04" stroke-width="1.5"/>
      <ellipse cx="66" cy="54" rx="5" ry="3" fill="#FFFFFF" opacity="0.7"/>
      <!-- Star Glyph -->
      <path d="M70 54 L72.5 59.5 L78 60.5 L74 64.5 L75 70 L70 67 L65 70 L66 64.5 L62 60.5 L67.5 59.5 Z" 
            fill="#B45309" stroke="#78350F" stroke-width="0.8" stroke-linejoin="round"/>
    </g>
  </g>
</svg>

