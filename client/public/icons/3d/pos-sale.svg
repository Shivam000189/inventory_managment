<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <!-- Background Shadow -->
    <filter id="shadow-pos" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#166534" flood-opacity="0.28"/>
    </filter>
    <filter id="coin-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#CA8A04" flood-opacity="0.4"/>
    </filter>

    <!-- Cart Gradients -->
    <linearGradient id="cart-basket" x1="16" y1="20" x2="72" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cart-rim" x1="18" y1="20" x2="72" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="metal-base" x1="20" y1="60" x2="68" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- 3D Coin Gradients -->
    <linearGradient id="gold-rim" x1="58" y1="12" x2="82" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="gold-face" x1="62" y1="16" x2="78" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <!-- Wheel Gradients -->
    <radialGradient id="wheel-rim" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <radialGradient id="wheel-hub" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </radialGradient>

    <!-- Highlights -->
    <linearGradient id="specular" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow-pos)">
    <!-- Cart Under-chassis -->
    <path d="M26 62 L32 72 L62 72 L68 62 Z" fill="url(#metal-base)" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Wheels Left & Right with 3D Depth -->
    <g>
      <circle cx="34" cy="78" r="8" fill="url(#wheel-rim)"/>
      <circle cx="34" cy="78" r="6" fill="#0F172A"/>
      <circle cx="33" cy="77" r="3.5" fill="url(#wheel-hub)"/>
      <circle cx="32" cy="76" r="1.2" fill="#FFFFFF"/>

      <circle cx="62" cy="78" r="8" fill="url(#wheel-rim)"/>
      <circle cx="62" cy="78" r="6" fill="#0F172A"/>
      <circle cx="61" cy="77" r="3.5" fill="url(#wheel-hub)"/>
      <circle cx="60" cy="76" r="1.2" fill="#FFFFFF"/>
    </g>

    <!-- Cart Basket Body -->
    <path d="M16 26 L22 58 C22.5 61 25 63 28 63 L68 63 C71 63 73.5 61 74 58 L80 30 C80.5 27 78.5 25 75.5 25 L21 25" 
          fill="url(#cart-basket)" stroke="#047857" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Top Rim (Glossy Lip) -->
    <path d="M15 25 C15 23.5 17 22.5 19 22.5 L77 22.5 C79 22.5 81 23.5 81 25 C81 26.5 79 27.5 77 27.5 L19 27.5 C17 27.5 15 26.5 15 25 Z" 
          fill="url(#cart-rim)"/>
    <ellipse cx="48" cy="24.5" rx="28" ry="1.5" fill="#FFFFFF" opacity="0.6"/>

    <!-- Basket Front Grid / Shading Layer -->
    <path d="M24 33 L73 33 M25 41 L71 41 M26 49 L69 49 M27 57 L67 57" 
          stroke="#065F46" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M34 27 L36 61 M48 27 L48 61 M62 27 L60 61" 
          stroke="#065F46" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Handle -->
    <path d="M16 24 L10 16 C9 14.5 7 14 5 15" stroke="url(#metal-base)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 15 L10 15" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>

    <!-- Gloss Specular on Basket -->
    <path d="M22 28 L27 57 C27.5 59 29 60 31 60 L38 60 L32 28 Z" fill="url(#specular)" opacity="0.35"/>

    <!-- Floating 3D Gold Coin with Sparkle -->
    <g filter="url(#coin-glow)">
      <!-- Outer Rim -->
      <circle cx="70" cy="24" r="14" fill="url(#gold-rim)"/>
      <ellipse cx="69" cy="23" rx="12" ry="12" fill="url(#gold-face)"/>
      <circle cx="69" cy="23" r="10" stroke="#CA8A04" stroke-width="1.2" opacity="0.6"/>
      <!-- Rupee / Currency Mark -->
      <path d="M66 18 L73 18 M66 21 L72 21 M66 18 L66 23 C68 23 71 23.5 71 25.5 C71 27.5 68 28 66 28 L72 32 M66 25 L69 25" 
            stroke="#854D0E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Coin Highlights -->
      <ellipse cx="65" cy="17" rx="4" ry="2" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="79" cy="15" r="1.5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>

