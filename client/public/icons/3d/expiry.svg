<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <filter id="exp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#E11D48" flood-opacity="0.28"/>
    </filter>
    <filter id="warn-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-color="#EA580C" flood-opacity="0.45"/>
    </filter>

    <!-- Clock Rim Gradient -->
    <linearGradient id="clock-rim" x1="16" y1="16" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="30%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <radialGradient id="clock-face" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </radialGradient>

    <!-- Warning Bell / Triangle Gradient -->
    <linearGradient id="warn-grad" x1="56" y1="52" x2="88" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="bell-hammer" x1="38" y1="10" x2="58" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="48" cy="86" rx="34" ry="5.5" fill="#0F172A" opacity="0.18"/>

  <!-- Alarm Clock Bells on Top -->
  <g filter="url(#exp-shadow)">
    <!-- Left Bell -->
    <ellipse cx="28" cy="22" rx="10" ry="7" transform="rotate(-30 28 22)" fill="url(#clock-rim)"/>
    <!-- Right Bell -->
    <ellipse cx="68" cy="22" rx="10" ry="7" transform="rotate(30 68 22)" fill="url(#clock-rim)"/>
    <!-- Central Hammer -->
    <rect x="45" y="14" width="6" height="8" rx="2" fill="url(#bell-hammer)"/>
    <circle cx="48" cy="13" r="4" fill="url(#bell-hammer)"/>
  </g>

  <!-- Main Clock Body -->
  <g filter="url(#exp-shadow)">
    <!-- Outer 3D Thick Rim -->
    <circle cx="48" cy="50" r="34" fill="url(#clock-rim)"/>
    <!-- Inner Dial Face -->
    <circle cx="48" cy="50" r="26" fill="url(#clock-face)"/>

    <!-- Dial Tick Marks -->
    <line x1="48" y1="28" x2="48" y2="33" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="48" y1="67" x2="48" y2="72" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="50" x2="31" y2="50" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round"/>
    <line x1="65" y1="50" x2="70" y2="50" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round"/>

    <!-- Clock Hands (urgent 5 to 12 position) -->
    <line x1="48" y1="50" x2="48" y2="34" stroke="#991B1B" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="50" x2="38" y2="39" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="48" cy="50" r="3.5" fill="#BE123C"/>

    <!-- Clock Feet (3D Pegs) -->
    <path d="M26 78 L20 86 H26 Z" fill="#991B1B"/>
    <path d="M70 78 L76 86 H70 Z" fill="#991B1B"/>
  </g>

  <!-- 3D Warning Triangle Beacon / Badge in Bottom-Right -->
  <g filter="url(#warn-glow)">
    <path d="M72 54 C73.5 51.5 76.5 51.5 78 54 L90 75 C91.5 77.5 90 81 87 81 H63 C60 81 58.5 77.5 60 75 Z" fill="url(#warn-grad)"/>
    <text x="75" y="76" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#78350F" text-anchor="middle">!</text>
  </g>
</svg>
