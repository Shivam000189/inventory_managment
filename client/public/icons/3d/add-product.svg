<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <filter id="box-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#1E3A8A" flood-opacity="0.3"/>
    </filter>
    <filter id="badge-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2563EB" flood-opacity="0.45"/>
    </filter>

    <!-- Isometric Box Faces -->
    <linearGradient id="box-top" x1="48" y1="18" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="60%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="box-left" x1="16" y1="36" x2="48" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="box-right" x1="48" y1="36" x2="80" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Tape / Ribbon Gradients -->
    <linearGradient id="ribbon-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="40%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- 3D Plus Sphere Badge -->
    <radialGradient id="plus-sphere" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="45%" stop-color="#22C55E"/>
      <stop offset="90%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </radialGradient>
  </defs>

  <g filter="url(#box-shadow)">
    <!-- 3D Isometric Box -->
    <!-- Top Face -->
    <path d="M48 18 L78 33 L48 48 L18 33 Z" fill="url(#box-top)" stroke="#1E40AF" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Top Highlight -->
    <path d="M48 20 L74 33 L48 45 L22 33 Z" fill="#FFFFFF" opacity="0.3"/>

    <!-- Left Face -->
    <path d="M18 33 L48 48 L48 76 L18 61 Z" fill="url(#box-left)" stroke="#1E3A8A" stroke-width="1.2" stroke-linejoin="round"/>
    
    <!-- Right Face -->
    <path d="M48 48 L78 33 L78 61 L48 76 Z" fill="url(#box-right)" stroke="#172554" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Decorative Packing Tape -->
    <!-- Top Tape Segment -->
    <path d="M43 20.5 L53 25.5 L53 45.5 L43 40.5 Z" fill="url(#ribbon-orange)" opacity="0.9"/>
    <!-- Left Tape Segment -->
    <path d="M43 45.5 L53 50.5 L53 73.5 L43 68.5 Z" fill="url(#ribbon-orange)" opacity="0.85"/>
    <path d="M18 45 L48 60 L48 66 L18 51 Z" fill="url(#ribbon-orange)" opacity="0.4"/>

    <!-- Glossy Edges -->
    <path d="M18 33 L48 48 L78 33" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
    <path d="M48 48 L48 76" stroke="#93C5FD" stroke-width="1" opacity="0.6"/>

    <!-- Floating 3D Plus Action Badge -->
    <g filter="url(#badge-glow)">
      <!-- Outer Ball -->
      <circle cx="70" cy="62" r="16" fill="url(#plus-sphere)"/>
      <ellipse cx="66" cy="54" rx="6" ry="3.5" fill="#FFFFFF" opacity="0.6" transform="rotate(-20 66 54)"/>
      <!-- Crisp White Plus Mark -->
      <path d="M70 52 L70 72 M60 62 L80 62" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="78" cy="53" r="1.5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>

