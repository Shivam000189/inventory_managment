<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <filter id="stockin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
    <filter id="arrow-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>

    <!-- Box isometric faces -->
    <linearGradient id="box-top-blue" x1="22" y1="36" x2="68" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="60%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="box-left-blue" x1="18" y1="52" x2="48" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="box-right-blue" x1="48" y1="52" x2="78" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Arrow 3D gradients -->
    <linearGradient id="arrow-grad" x1="48" y1="8" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="arrow-side" x1="32" y1="20" x2="64" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Pallet wood gradients -->
    <linearGradient id="wood-top" x1="14" y1="78" x2="82" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="wood-side" x1="14" y1="84" x2="82" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <!-- Ground Ambient Shadow -->
  <ellipse cx="48" cy="88" rx="34" ry="5.5" fill="#0F172A" opacity="0.16"/>

  <g filter="url(#stockin-shadow)">
    <!-- Pallet Wooden Base -->
    <path d="M14 79 L48 90 L82 79 L48 68 Z" fill="url(#wood-top)"/>
    <path d="M14 79 L48 90 V93 L14 82 Z" fill="url(#wood-side)"/>
    <path d="M48 90 L82 79 V82 L48 93 Z" fill="#92400E"/>

    <!-- Pallet Foot blocks -->
    <rect x="20" y="83" width="7" height="4" rx="1.5" fill="#78350F"/>
    <rect x="44.5" y="87" width="7" height="4" rx="1.5" fill="#78350F"/>
    <rect x="69" y="83" width="7" height="4" rx="1.5" fill="#78350F"/>

    <!-- Main 3D Box (Isometric Cube) -->
    <!-- Top Face -->
    <path d="M48 38 L76 50 L48 62 L20 50 Z" fill="url(#box-top-blue)"/>
    <!-- Left Face -->
    <path d="M20 50 L48 62 V84 L20 72 Z" fill="url(#box-left-blue)"/>
    <!-- Right Face -->
    <path d="M48 62 L76 50 V72 L48 84 Z" fill="url(#box-right-blue)"/>

    <!-- Box Tape / Strapping -->
    <path d="M34 44 L62 56 L58 57.5 L30 45.5 Z" fill="#FDE047" opacity="0.8"/>
    <path d="M46 61.2 L50 59.5 V83.2 L46 84.8 Z" fill="#FACC15" opacity="0.8"/>

    <!-- Edge Specular Glint -->
    <path d="M20 50 L48 62 L76 50" stroke="#BAE6FD" stroke-width="1.2" stroke-linejoin="round" opacity="0.75"/>
  </g>

  <!-- Big 3D Downward Arrow (Stock In) -->
  <g filter="url(#arrow-glow)">
    <!-- Arrow 3D Bevel/Extrusion -->
    <path d="M43 14 H53 V26 H64 L48 45 L32 26 H43 Z" fill="url(#arrow-side)" transform="translate(0, 2)"/>
    <!-- Arrow Front Face -->
    <path d="M43 12 H53 V24 H64 L48 43 L32 24 H43 Z" fill="url(#arrow-grad)"/>

    <!-- Inner Gloss Highlight -->
    <path d="M45 13 H51 V25 H60 L48 40 L36 25 H45 Z" fill="#FFFFFF" opacity="0.32"/>
    <ellipse cx="48" cy="16" rx="3.5" ry="1.5" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>
