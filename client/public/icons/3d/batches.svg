<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <filter id="batch-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0D9488" flood-opacity="0.25"/>
    </filter>
    <filter id="badge-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>

    <!-- Medicine Box 1 (Teal/Emerald) -->
    <linearGradient id="med1-top" x1="16" y1="46" x2="62" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="med1-left" x1="16" y1="60" x2="44" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="med1-right" x1="44" y1="60" x2="72" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>

    <!-- Medicine Box 2 (Violet / Indigo Stacked Above) -->
    <linearGradient id="med2-top" x1="28" y1="20" x2="74" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="med2-left" x1="28" y1="34" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="med2-right" x1="54" y1="34" x2="82" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>

    <!-- Barcode / Batch Seal Gradient -->
    <linearGradient id="badge-grad" x1="48" y1="62" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="48" cy="87" rx="36" ry="6" fill="#0F172A" opacity="0.18"/>

  <!-- Lower Box (Teal) -->
  <g filter="url(#batch-shadow)">
    <!-- Top -->
    <path d="M44 48 L72 58 L44 68 L16 58 Z" fill="url(#med1-top)"/>
    <!-- Left -->
    <path d="M16 58 L44 68 V86 L16 76 Z" fill="url(#med1-left)"/>
    <!-- Right -->
    <path d="M44 68 L72 58 V76 L44 86 Z" fill="url(#med1-right)"/>

    <!-- Cross Symbol on Lower Box Face -->
    <path d="M26 67 H32 V64 H34 V67 H40 V69 H34 V72 H32 V69 H26 Z" fill="#CCFBF1" opacity="0.9"/>
  </g>

  <!-- Upper Box (Purple, Offset) -->
  <g filter="url(#batch-shadow)">
    <!-- Top -->
    <path d="M52 20 L80 30 L52 40 L24 30 Z" fill="url(#med2-top)"/>
    <!-- Left -->
    <path d="M24 30 L52 40 V58 L24 48 Z" fill="url(#med2-left)"/>
    <!-- Right -->
    <path d="M52 40 L80 30 V48 L52 58 Z" fill="url(#med2-right)"/>

    <!-- Medicine Capsule Illustration on Upper Box -->
    <g transform="translate(32, 36) rotate(-25)">
      <rect x="0" y="0" width="8" height="16" rx="4" fill="#FFFFFF"/>
      <path d="M0 8 H8 V12 C8 14.2 6.2 16 4 16 C1.8 16 0 14.2 0 12 Z" fill="#F43F5E"/>
    </g>
  </g>

  <!-- 3D Batch ID Tag / Shield Badge in Foreground -->
  <g filter="url(#badge-glow)">
    <rect x="52" y="62" width="34" height="22" rx="5" fill="url(#badge-grad)"/>
    <rect x="54" y="64" width="30" height="18" rx="3.5" fill="#FFFFFF"/>

    <!-- Barcode lines -->
    <line x1="58" y1="68" x2="58" y2="76" stroke="#0F172A" stroke-width="2"/>
    <line x1="62" y1="68" x2="62" y2="76" stroke="#0F172A" stroke-width="1"/>
    <line x1="65" y1="68" x2="65" y2="76" stroke="#0F172A" stroke-width="2"/>
    <line x1="69" y1="68" x2="69" y2="76" stroke="#0F172A" stroke-width="1"/>
    <line x1="72" y1="68" x2="72" y2="76" stroke="#0F172A" stroke-width="2.5"/>
    <line x1="77" y1="68" x2="77" y2="76" stroke="#0F172A" stroke-width="1.5"/>

    <text x="69" y="80" font-family="Arial, sans-serif" font-weight="700" font-size="4.5" fill="#0369A1" text-anchor="middle">LOT-2026</text>
  </g>
</svg>
