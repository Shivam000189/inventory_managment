<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <filter id="ret-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#E11D48" flood-opacity="0.25"/>
    </filter>
    <filter id="loop-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#F43F5E" flood-opacity="0.38"/>
    </filter>

    <!-- Box isometric faces (Warm Coral / Cardboard) -->
    <linearGradient id="ret-box-top" x1="24" y1="34" x2="68" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="50%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="ret-box-left" x1="20" y1="52" x2="48" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="ret-box-right" x1="48" y1="52" x2="76" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Loop Arrow 3D Red/Rose -->
    <linearGradient id="loop-body" x1="20" y1="18" x2="84" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="35%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="loop-arrow-head" x1="14" y1="36" x2="36" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="48" cy="86" rx="34" ry="5.5" fill="#0F172A" opacity="0.18"/>

  <!-- Main Box -->
  <g filter="url(#ret-shadow)">
    <!-- Top Face -->
    <path d="M48 34 L76 46 L48 58 L20 46 Z" fill="url(#ret-box-top)"/>
    <!-- Left Face -->
    <path d="M20 46 L48 58 V80 L20 68 Z" fill="url(#ret-box-left)"/>
    <!-- Right Face -->
    <path d="M48 58 L76 46 V68 L48 80 Z" fill="url(#ret-box-right)"/>

    <!-- Sealing Tape -->
    <path d="M34 40 L62 52 L57 54 L29 42 Z" fill="#93C5FD" opacity="0.8"/>
    <path d="M46 57.2 L50 55.5 V79.2 L46 80.8 Z" fill="#60A5FA" opacity="0.8"/>

    <!-- Receipt / Return Slip Tucked on Right Face -->
    <path d="M54 57 L68 51 L71 65 L57 71 Z" fill="#FFFFFF"/>
    <line x1="56" y1="60" x2="66" y2="55" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="57" y1="64" x2="68" y2="59" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="58" y1="68" x2="65" y2="65" stroke="#F43F5E" stroke-width="1.2"/>
  </g>

  <!-- 3D Sweeping Counter-Clockwise Return Arrow Wrapping Around Box -->
  <g filter="url(#loop-glow)">
    <!-- Arc Path around back and top -->
    <path d="M72 62 C84 54 86 36 74 24 C62 12 38 14 26 26 C21 31 18 38 18 45" 
          fill="none" stroke="url(#loop-body)" stroke-width="8" stroke-linecap="round"/>

    <!-- Arrow Specular Highlight Streak -->
    <path d="M68 25 C58 17 40 18 30 28" 
          fill="none" stroke="#FFE4E6" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Bold Arrowhead pointing down/left -->
    <path d="M10 40 L20 54 L32 40 Z" fill="url(#loop-arrow-head)"/>
    <path d="M12 41 L20 52 L28 41 Z" fill="#FFE4E6" opacity="0.4"/>
  </g>
</svg>
